server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源缓存（vendor/指纹文件名可长缓存；html/js/css 开发期不缓存）
    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 轻量持久化 API（translate-api：术语干预 / 翻译历史，SQLite 落库）
    location /api/ {
        proxy_pass http://translate-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 2m;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反代到本机 Ollama（Windows 侧 11434）。
    location /ollama/ {
        proxy_pass http://192.168.31.28:11434/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;

        # 浏览器是同源访问（页面与 /ollama/ 同域），本不需要 CORS。
        # 但 Ollama 会自行校验 Origin 白名单，带 Origin 一律 403。
        # 因此在这里剥掉 Origin / Referer，让请求以"非浏览器来源"抵达 Ollama。
        proxy_set_header Origin "";
        proxy_set_header Referer "";

        # 流式输出必须关闭缓冲，否则译文会等全部生成完才出现
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        chunked_transfer_encoding on;
    }
}
