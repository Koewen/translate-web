<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>译 · 本地翻译工作台</title>
<meta name="description" content="本地离线翻译服务 —— 基于 Qwen3.5 9B 本地模型，文本不离开本地网络。">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.svg">
<meta name="theme-color" content="#f5f8ff">
<!-- 主题先行：避免首帧闪烁（Element Plus 暗色走 html.dark 类） -->
<script>
(function(){
  var t = localStorage.getItem('hy_mt_theme')
        || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', t);
  if (t === 'dark') document.documentElement.classList.add('dark');
})();
</script>
<link rel="stylesheet" href="/vendor/element-plus.css">
<link rel="stylesheet" href="/vendor/ep-dark-vars.css">
<link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<div class="aurora" aria-hidden="true">
  <i class="blob b1"></i>
  <i class="blob b2"></i>
  <i class="blob b3"></i>
  <i class="blob b4"></i>
</div>
<div id="app"></div>
<script src="/vendor/vue.global.prod.js"></script>
<script src="/vendor/element-plus.full.min.js"></script>
<script src="/vendor/ep-locale-zh-cn.min.js"></script>
<script src="/vendor/ep-icons.min.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
